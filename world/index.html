<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEVIN — The World</title>
<meta name="description" content="Walk around Kevin's town. His block, downtown, his street, and the insides of the places he actually goes. Early build.">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/png/favicon-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="../assets/png/favicon-512.png">
<meta name="theme-color" content="#ffe500">
<style>
  @font-face{font-family:'Luckiest Guy';src:url('../assets/fonts/luckiest-guy-400.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Space Mono';src:url('../assets/fonts/space-mono-700.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{--void:#ffe500;--deep:#f5c400;--ink:#0b0b0b;--red:#e8232b;--cream:#fff6c8;--kek:#2fbf4a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
    font-family:'Space Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:block;touch-action:none}

  .frame{position:fixed;pointer-events:none;font-weight:700}
  .panel{
    background:var(--ink);color:var(--void);border:4px solid var(--ink);
    border-radius:14px;box-shadow:6px 6px 0 rgba(0,0,0,.45);
    padding:11px 15px;pointer-events:auto;
  }
  .panel--light{background:var(--cream);color:var(--ink)}
  #hud-top{top:max(14px,env(safe-area-inset-top));left:14px;right:14px;
    display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  #where{font-family:'Luckiest Guy',system-ui;font-size:20px;letter-spacing:.02em;line-height:1.15}
  #where small{display:block;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;opacity:.62;margin-top:3px}
  #links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  #links a{
    display:block;background:var(--void);color:var(--ink);border:4px solid var(--ink);
    border-radius:11px;box-shadow:4px 4px 0 rgba(0,0,0,.45);
    padding:8px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    text-decoration:none;pointer-events:auto;
  }
  #links a:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.45)}

  /* the job counter, only on screen while a job is running */
  #job{left:14px;top:calc(max(14px,env(safe-area-inset-top)) + 74px);
    background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:8px 13px;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;line-height:1.6;display:none}
  #job b{color:var(--void);font-size:15px}
  #job.on{display:block}

  #tip{left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));
    font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;text-align:center;
    max-width:min(92vw,520px);opacity:0;transition:opacity .22s}
  #tip.on{opacity:1}
  #tip.go{background:var(--red);color:#fff;cursor:pointer}
  #tip.go:active{transform:translateX(-50%) translate(2px,2px)}

  #wip{right:14px;bottom:max(12px,env(safe-area-inset-bottom));max-width:min(60vw,420px);
    background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:9px 16px;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;text-align:center;line-height:1.5}
  #wip b{color:var(--void)}

  /* touch stick — only on coarse pointers */
  #stick{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));
    width:132px;height:132px;border-radius:50%;border:4px solid var(--ink);
    background:rgba(255,229,0,.28);display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;background:var(--red);border:4px solid var(--ink)}
  @media (pointer:coarse){ #stick{display:block} #tip{bottom:calc(170px + env(safe-area-inset-bottom))} }

  #boot{position:fixed;inset:0;background:var(--void);display:grid;place-items:center;
    font-family:'Luckiest Guy',system-ui;font-size:30px;color:var(--ink);z-index:9}

  /* Said in the corner, not across the whole screen. Whatever is missing, the
     rest of the world is still there to walk around. */
  #note{left:50%;transform:translateX(-50%);top:calc(max(14px,env(safe-area-inset-top)) + 92px);
    background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:8px 14px;font-size:12px;
    letter-spacing:.1em;text-transform:uppercase;text-align:center;display:none}
  #note.on{display:block}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="frame" id="hud-top">
  <div class="panel" id="where">Kevin's Block<small id="sub">tap the ground or use the stick</small></div>
  <div id="links">
    <a href="../">Site</a><a href="../docs/">Docs</a><a href="../gym/">Gym</a>
  </div>
</div>

<div class="frame" id="note"></div>
<div class="frame" id="job"></div>
<div class="frame panel panel--light" id="tip"></div>

<div class="frame" id="wip">
  <b>Early build.</b> Seven places, two jobs. More going in.
</div>

<div id="stick"><div id="knob"></div></div>
<div id="boot">loading the world…</div>

<script src="zones.js?v=0fa2ac6f"></script>
<script type="module">
/* Kevin's town.
   Canvas 2D on purpose: the art is flat with heavy outlines, which a 2D
   context draws perfectly and a 3D engine only makes heavier. The whole page
   is a few KB plus one sprite atlas and one painting per zone, so it opens
   instantly on a phone — which matters more than a renderer nobody can see
   the benefit of. */

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
const boot = document.getElementById('boot');

// ctx.roundRect landed in Safari 16.4, March 2023. Every sign, every exit
// plate and every tray is drawn with it, so on an iPhone a version behind that
// the very first frame throws and the world is a still image with a joystick.
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const k = Math.min(typeof r === 'number' ? r : (r && r[0]) || 0, w / 2, h / 2);
    this.moveTo(x + k, y);
    this.arcTo(x + w, y,     x + w, y + h, k);
    this.arcTo(x + w, y + h, x,     y + h, k);
    this.arcTo(x,     y + h, x,     y,     k);
    this.arcTo(x,     y,     x + w, y,     k);
    this.closePath();
  };
}

/* ---------- assets ---------- */
const ATLAS = { cols:9, rows:5, cw:158, ch:176,
                row:{ front:0, back:1, left:2, right:3, diagonal:4 } };
const sheet = new Image(); sheet.src = '../assets/sprites/walk-atlas.png';
// The world does NOT wait for this. It is over a megabyte, and on a bad
// connection it can hang for as long as it likes without ever failing — which
// is not the same thing as failing, so no catch ever runs. Gating the page on
// it meant sitting on "loading the world…" forever, over a world that was
// ready to walk around.
let spriteReady = false;
sheet.onload = () => { spriteReady = true; note(''); };
sheet.onerror = () => { note('Kevin\'s sprite did not load. Reload to try again.'); };
// A cached image can finish before the handler above is attached.
if (sheet.complete && sheet.naturalWidth) spriteReady = true;
// the zone's painting is loaded by enter(), below

/* ---------- zones ----------
   The engine knows how to walk around A zone. It knows nothing about which
   zones exist — that is all in zones.js, in the painting's own pixels, so
   adding a place is a painting plus a data entry. */
const IMG = { w: 1536, h: 864 };
const ZONES = window.KEVIN_ZONES;
let Z = null, key = null, art = null, job = null, exitLock = true;
const player = { x:0, y:0, vx:0, vy:0, dir:'front', flip:false, step:0, moving:false };

// Progress is per visit. Walking out of the shift and back in starts it again,
// which is the honest reading of a shift.
function startJob(){
  job = null;
  if (!Z.job) return;
  job = { def: Z.job, held: 0, left: Z.job.drops.map(([x,y]) => ({ x, y })), done: false };
}

function enter(to, at){
  const next = ZONES[to];
  if (!next) return;
  Z = next; key = to;
  location.hash = to;
  const p = at || Z.spawn;
  player.x = p.x; player.y = p.y; player.vx = player.vy = 0;
  goal = null; near = null;
  // You spawn standing on the doorway you came through. Without this you would
  // be pushed straight back out of it on the first frame.
  exitLock = true;
  document.getElementById('where').firstChild.textContent = Z.name;
  startJob();
  const img = new Image();
  img.onload  = () => { if (Z === next) art = img; };
  img.onerror = () => { if (Z === next) art = null; };  // an unpainted zone says so
  art = null;
  img.src = Z.art;
}

// The address bar is a way in. Back, forward, and a pasted #downtown all
// land somewhere real instead of silently doing nothing.
addEventListener('hashchange', () => {
  const to = location.hash.slice(1);
  if (ZONES[to] && to !== key) enter(to);
});

/* ---------- input ---------- */
const keys = new Set();
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
  const k = e.key.toLowerCase();
  if ((k === 'e' || k === 'enter') && near && (near.href || near.to)) activate(near);
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickV = {x:0,y:0}, stickId = null;
function stickAt(t){
  const r = stick.getBoundingClientRect();
  let dx = t.clientX-(r.left+r.width/2), dy = t.clientY-(r.top+r.height/2);
  const d = Math.hypot(dx,dy), max = r.width/2-12;
  if (d>max){ dx=dx/d*max; dy=dy/d*max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  stickV = { x:dx/max, y:dy/max };
}
stick.addEventListener('pointerdown', e=>{ stickId=e.pointerId; stick.setPointerCapture(e.pointerId); stickAt(e); });
stick.addEventListener('pointermove', e=>{ if(e.pointerId===stickId) stickAt(e); });
const drop = e=>{ if(e.pointerId===stickId){ stickId=null; stickV={x:0,y:0}; knob.style.transform=''; } };
stick.addEventListener('pointerup', drop); stick.addEventListener('pointercancel', drop);

// tap the floor to walk there
let goal = null;
cv.addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  const p = toImg(e.clientX, e.clientY);
  if (inside(p.x, p.y)) goal = p;
});

// There is no E key on a phone, so the prompt itself is the button.
const tip = document.getElementById('tip');
tip.addEventListener('click', () => { if (near) activate(near); });

function activate(p){
  if (p.to) return enter(p.to, p.at);
  if (!p.href) return;
  if (p.ext) window.open(p.href, '_blank', 'noopener');
  else location.href = p.href;
}

/* ---------- fit ---------- */
let fit = { s:1, ox:0, oy:0 };
function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // cover, so there is never a letterbox bar beside the painting
  const s = Math.max(innerWidth/IMG.w, innerHeight/IMG.h);
  fit = { s, ox:(innerWidth - IMG.w*s)/2, oy:(innerHeight - IMG.h*s)/2 };
}
addEventListener('resize', resize); resize();
const toScreen = (x,y) => ({ x: x*fit.s + fit.ox, y: y*fit.s + fit.oy });
const toImg = (x,y) => ({ x:(x-fit.ox)/fit.s, y:(y-fit.oy)/fit.s });

function inside(x,y){
  const F = Z.floor; let hit = false;
  for (let i=0, j=F.length-1; i<F.length; j=i++){
    const [xi,yi]=F[i], [xj,yj]=F[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) hit = !hit;
  }
  return hit;
}
// Y is squashed relative to X in an oblique view, so distances are measured in
// the same squashed space the character walks in.
const reach = (x,y) => Math.hypot(player.x-x, (player.y-y)/0.62);

/* ---------- draw ---------- */
function plate(x, y, text, size, bg, fg){
  ctx.font = `${size}px 'Luckiest Guy', system-ui`;
  const w = ctx.measureText(text).width + 26*fit.s, h = size*1.6;
  ctx.beginPath(); ctx.roundRect(x-w/2, y-h/2, w, h, 8*fit.s);
  ctx.fillStyle = bg; ctx.fill();
  ctx.lineWidth = 4*fit.s; ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
  ctx.fillStyle = fg; ctx.fillText(text, x, y + size*0.35);
  return h;
}

function note(text){
  const el = document.getElementById('note');
  if (!el) return;
  el.textContent = text;
  el.classList.toggle('on', !!text);
}

function drawKevin(){
  const s = toScreen(player.x, player.y);
  // Further up the floor reads as further away, so the character scales with it.
  const depth = 0.80 + 0.28*((player.y-455)/(830-455));
  const k = 0.86 * fit.s * depth;
  const w = ATLAS.cw*k, h = ATLAS.ch*k;
  ctx.save(); ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.ellipse(s.x, s.y, w*0.30, h*0.06, 0,0,7);
  ctx.fillStyle='#000'; ctx.fill(); ctx.restore();
  if (!spriteReady) {
    // He is still on his way. Draw where he is standing so the controls still
    // make sense, rather than steering something invisible.
    ctx.beginPath(); ctx.arc(s.x, s.y - 26*fit.s, 15*fit.s, 0, 7);
    ctx.fillStyle = '#e8232b'; ctx.fill();
    ctx.lineWidth = 4*fit.s; ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
    return;
  }
  const col = player.moving ? (player.step|0) % ATLAS.cols : 0;
  ctx.save(); ctx.translate(s.x, s.y-h);
  if (player.flip){ ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(sheet, col*ATLAS.cw, ATLAS.row[player.dir]*ATLAS.ch, ATLAS.cw, ATLAS.ch, 0,0,w,h);
  ctx.restore();
}

function drawExits(){
  ctx.textAlign='center';
  for (const e of Z.exits){
    const s = toScreen(e.x, e.y - 58);
    plate(s.x, s.y, e.label, Math.round(15*fit.s), '#e8232b', '#fff');
  }
}

function drawSpots(){
  ctx.textAlign = 'center';
  for (const p of Z.spots){
    const s = toScreen(p.x, p.signY ?? p.y);
    const on = near === p;
    const fs = Math.round((p.flat ? 15 : 19)*fit.s);
    const h = plate(s.x, s.y - (p.flat ? 0 : fs*0.8), p.name, fs,
                    on ? '#e8232b' : '#0b0b0b', on ? '#fff' : '#ffe500');
    // Outside, a short post ties the plate to the roof it belongs to. Inside,
    // the label floats where the thing is, so there is nothing to tie it to.
    if (!p.flat){
      ctx.beginPath(); ctx.moveTo(s.x, s.y - fs*0.8 + h/2); ctx.lineTo(s.x, s.y + 14*fit.s);
      ctx.lineWidth = 5*fit.s; ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
    }
  }
}

function drawJob(){
  if (!job || job.done) return;
  const J = job.def;
  ctx.textAlign = 'center';
  // what is still to be delivered
  for (const d of job.left){
    const s = toScreen(d.x, d.y);
    const w = 26*fit.s, h = 17*fit.s;
    ctx.save();
    ctx.globalAlpha = .25;
    ctx.beginPath(); ctx.ellipse(s.x, s.y+h*0.7, w*0.6, h*0.3, 0,0,7);
    ctx.fillStyle = '#000'; ctx.fill();
    ctx.restore();
    const bob = Math.sin(performance.now()/300 + d.x) * 3 * fit.s;
    ctx.beginPath(); ctx.roundRect(s.x-w/2, s.y-h+bob, w, h, 4*fit.s);
    ctx.fillStyle = job.held > 0 ? '#ffe500' : '#fff6c8'; ctx.fill();
    ctx.lineWidth = 4*fit.s; ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
  }
  // where you pick up, when your hands are empty and there is anything left
  if (job.held === 0 && job.left.length){
    const s = toScreen(J.pickup.x, J.pickup.y);
    plate(s.x, s.y, J.pickup.label, Math.round(14*fit.s), '#ffe500', '#0b0b0b');
  }
}

function paintHud(){
  const el = document.getElementById('job');
  if (!job){ el.classList.remove('on'); return; }
  el.classList.add('on');
  const J = job.def, total = J.drops.length, left = job.left.length;
  el.innerHTML = job.done
    ? `${J.title}<br><b>${J.done}</b>`
    : `${J.title}<br><b>${total-left}/${total}</b> ${J.unit}` +
      (job.held ? ` &middot; carrying ${job.held}` : ` &middot; ${J.idle}`);
}

/* ---------- loop ---------- */
const sub = document.getElementById('sub');
let near = null, last = performance.now(), hudKey = '';

function step(now){
  const dt = Math.min((now-last)/1000, .05); last = now;

  let ix = (keys.has('arrowright')||keys.has('d')?1:0) - (keys.has('arrowleft')||keys.has('a')?1:0);
  let iy = (keys.has('arrowdown')||keys.has('s')?1:0) - (keys.has('arrowup')||keys.has('w')?1:0);
  if (Math.abs(stickV.x)>.18 || Math.abs(stickV.y)>.18){ ix=stickV.x; iy=stickV.y; goal=null; }
  if (ix||iy) goal = null;
  if (goal){
    const dx = goal.x-player.x, dy = goal.y-player.y, d = Math.hypot(dx,dy);
    if (d < 12) goal = null; else { ix = dx/d; iy = dy/d; }
  }
  const m = Math.hypot(ix,iy); if (m>1){ ix/=m; iy/=m; }

  const SPEED = 300;
  player.vx += (ix*SPEED - player.vx)*Math.min(1, dt*12);
  player.vy += (iy*SPEED*0.62 - player.vy)*Math.min(1, dt*12);  // Y squashed ~1.6x
  const nx = player.x + player.vx*dt, ny = player.y + player.vy*dt;
  if (inside(nx, player.y)) player.x = nx; else player.vx = 0;
  if (inside(player.x, ny)) player.y = ny; else player.vy = 0;

  const sp = Math.hypot(player.vx, player.vy/0.62);
  player.moving = sp > 20;
  if (player.moving){
    player.step += dt*9*Math.min(1, sp/250);
    const ay = player.vy/0.62;
    if (Math.abs(player.vx) > Math.abs(ay)*1.3){ player.dir = player.vx>0?'right':'left'; player.flip=false; }
    else if (Math.abs(ay) > Math.abs(player.vx)*1.3){ player.dir = ay>0?'front':'back'; player.flip=false; }
    else { player.dir='diagonal'; player.flip = player.vx<0; }
  }

  // the job: walk into the pass to load up, walk over a marker to deliver
  if (job && !job.done){
    const J = job.def;
    if (job.held === 0 && job.left.length && reach(J.pickup.x, J.pickup.y) < J.pickup.r)
      job.held = Math.min(J.carry, job.left.length);
    if (job.held > 0){
      const i = job.left.findIndex(d => reach(d.x, d.y) < 58);
      if (i > -1){ job.left.splice(i,1); job.held--; }
    }
    if (!job.left.length){ job.done = true; job.held = 0; }
  }

  let best=null, bd=Infinity;
  for (const p of Z.spots){
    const d = reach(p.x, p.y);
    if (d < p.r && d < bd){ bd=d; best=p; }
  }
  // Walking into an exit moves zone — no prompt, no key. The lock stops the
  // doorway you arrived on from throwing you straight back out.
  let onExit = false;
  for (const e of Z.exits){
    if (reach(e.x, e.y) < e.r){
      onExit = true;
      if (!exitLock){ enter(e.to, e.at); return requestAnimationFrame(step); }
    }
  }
  if (!onExit) exitLock = false;

  if (best!==near){
    near=best; tip.classList.toggle('on', !!near);
    const go = !!(near && (near.href || near.to));
    tip.classList.toggle('go', go);
    if (near) tip.textContent = near.tip + (go ? '  ·  press E or tap here' : '');
    sub.textContent = near ? near.name.toLowerCase() : 'tap the ground or use the stick';
  }
  ctx.fillStyle = '#ffe500'; ctx.fillRect(0,0,innerWidth,innerHeight);
  if (art) ctx.drawImage(art, fit.ox, fit.oy, IMG.w*fit.s, IMG.h*fit.s);
  else {
    // Not painted yet. Say that, rather than render an empty yellow rectangle
    // and let somebody think it is the place.
    ctx.fillStyle = '#0b0b0b'; ctx.textAlign = 'center';
    ctx.font = `${Math.round(30*fit.s)}px 'Luckiest Guy', system-ui`;
    ctx.fillText(Z.name.toUpperCase(), innerWidth/2, innerHeight/2 - 10*fit.s);
    ctx.font = `700 ${Math.round(13*fit.s)}px 'Space Mono', monospace`;
    ctx.fillText('NOT PAINTED YET — WALK BACK THE WAY YOU CAME', innerWidth/2, innerHeight/2 + 22*fit.s);
  }
  drawExits();
  drawJob();
  drawSpots();
  drawKevin();

  // the HUD is DOM, so only touch it when the numbers actually move
  const k = job ? `${job.def.id}|${job.left.length}|${job.held}|${job.done}` : '';
  if (k !== hudKey){ hudKey = k; paintHud(); }

  requestAnimationFrame(step);
}

// Start now. The painting, the doors, the jobs and the walking are all ready
// the moment this module runs.
//
// AND COME OFF THE LOADING SCREEN WHATEVER HAPPENS. Anything thrown between
// the top of this module and here used to leave "loading the world…" across
// the whole page with no error, no console for a phone to show it in, and
// nothing for the reader to do. A boot screen that can outlive its own boot is
// worse than no boot screen: it reports a state that is not true and cannot
// change. So: say what broke, and get out of the way.
try {
  if (!ZONES) throw new Error('zones.js did not load');
  enter(ZONES[location.hash.slice(1)] ? location.hash.slice(1) : 'block');
  boot.remove();
  if (!spriteReady) note('Kevin is still loading. Everything else works.');
  requestAnimationFrame(step);
} catch (e) {
  boot.innerHTML =
    '<div style="max-width:30ch;font-size:19px;line-height:1.35">' +
    'The world did not start.<br>' +
    '<span style="font-family:monospace;font-size:12px;opacity:.7;word-break:break-word">' +
    String(e && e.message || e).replace(/[<>&]/g, '') + '</span><br>' +
    '<a href="../" style="font-size:13px">back to the site</a></div>';
}

// A last resort. If the module never reached either branch above — a syntax
// error in an older engine takes the whole script, so no catch of mine runs —
// the boot screen is still sitting there a few seconds later. Take it off and
// say so, rather than leave somebody staring at a word.
setTimeout(function () {
  const b = document.getElementById('boot');
  if (!b) return;
  b.innerHTML =
    '<div style="max-width:30ch;font-size:19px;line-height:1.35">' +
    'This browser could not start the world.<br>' +
    '<span style="font-size:13px;opacity:.75">Everything else on the site works — ' +
    'the world needs a newer browser than this one.</span><br>' +
    '<a href="../" style="font-size:13px">back to the site</a></div>';
}, 6000);
</script>
</body>
</html>
