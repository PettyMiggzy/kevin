<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KEVIN — The Block</title>
<meta name="description" content="Walk around Kevin's block. Early build.">
<link rel="icon" href="../assets/art/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#ffe500">
<style>
  @font-face{font-family:'Luckiest Guy';src:url('../assets/fonts/luckiest-guy-400.woff2') format('woff2');font-display:swap}
  @font-face{font-family:'Space Mono';src:url('../assets/fonts/space-mono-700.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{--void:#ffe500;--deep:#f5c400;--ink:#0b0b0b;--red:#e8232b;--cream:#fff6c8;--kek:#2fbf4a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--ink);
    font-family:'Space Mono',ui-monospace,monospace;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:block;touch-action:none}

  .frame{position:fixed;pointer-events:none;font-weight:700}
  .panel{
    background:var(--ink);color:var(--void);border:4px solid var(--ink);
    border-radius:14px;box-shadow:6px 6px 0 rgba(0,0,0,.45);
    padding:11px 15px;pointer-events:auto;
  }
  .panel--light{background:var(--cream);color:var(--ink)}
  #hud-top{top:max(14px,env(safe-area-inset-top));left:14px;right:14px;
    display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
  #where{font-family:'Luckiest Guy',system-ui;font-size:20px;letter-spacing:.02em;line-height:1.15}
  #where small{display:block;font-family:'Space Mono',monospace;font-size:11px;
    letter-spacing:.18em;text-transform:uppercase;opacity:.62;margin-top:3px}
  #links{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
  #links a{
    display:block;background:var(--void);color:var(--ink);border:4px solid var(--ink);
    border-radius:11px;box-shadow:4px 4px 0 rgba(0,0,0,.45);
    padding:8px 12px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    text-decoration:none;pointer-events:auto;
  }
  #links a:active{transform:translate(2px,2px);box-shadow:2px 2px 0 rgba(0,0,0,.45)}

  #tip{left:50%;transform:translateX(-50%);bottom:calc(112px + env(safe-area-inset-bottom));
    font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;text-align:center;
    max-width:min(92vw,520px);opacity:0;transition:opacity .22s}
  #tip.on{opacity:1}

  #wip{left:50%;transform:translateX(-50%);bottom:max(12px,env(safe-area-inset-bottom));
    background:var(--red);color:#fff;border:4px solid var(--ink);border-radius:12px;
    box-shadow:5px 5px 0 rgba(0,0,0,.45);padding:9px 16px;font-size:12px;
    letter-spacing:.16em;text-transform:uppercase;text-align:center;line-height:1.5}
  #wip b{color:var(--void)}

  /* touch stick — only on coarse pointers */
  #stick{position:fixed;left:20px;bottom:calc(20px + env(safe-area-inset-bottom));
    width:132px;height:132px;border-radius:50%;border:4px solid var(--ink);
    background:rgba(255,229,0,.28);display:none;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;background:var(--red);border:4px solid var(--ink)}
  @media (pointer:coarse){ #stick{display:block} #tip{bottom:calc(170px + env(safe-area-inset-bottom))} }

  #boot{position:fixed;inset:0;background:var(--void);display:grid;place-items:center;
    font-family:'Luckiest Guy',system-ui;font-size:30px;color:var(--ink);z-index:9}
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div class="frame" id="hud-top">
  <div class="panel" id="where">Kevin's Block<small id="sub">tap the ground or use the stick</small></div>
  <div id="links">
    <a href="../">Site</a><a href="../docs/">Docs</a><a href="../gym/">Gym</a>
  </div>
</div>

<div class="frame panel panel--light" id="tip"></div>

<div class="frame" id="wip">
  <b>Early build.</b> Kevin walks, the block is being built around him.
</div>

<div id="stick"><div id="knob"></div></div>
<div id="boot">loading the block…</div>

<script type="module">
/* Kevin's block.
   Canvas 2D on purpose: the art is flat with heavy outlines, which a 2D
   context draws perfectly and a 3D engine only makes heavier. The whole page
   is a few KB plus one sprite atlas, so it opens instantly on a phone — which
   matters more than a renderer nobody can see the benefit of. */

const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha: false });
const boot = document.getElementById('boot');

const C = { void:'#ffe500', deep:'#f5c400', dark:'#e0b400', ink:'#0b0b0b',
            red:'#e8232b', redDark:'#b0141b', cream:'#fff6c8', white:'#fff',
            kek:'#2fbf4a', grey:'#8a92b2' };

/* ---------- assets ---------- */
const ATLAS = { cols:9, rows:5, cw:158, ch:176,
                row:{ front:0, back:1, left:2, right:3, diagonal:4 } };
const sheet = new Image(); sheet.src = '../assets/sprites/walk-atlas.png';
const block = new Image(); block.src = '../assets/png/world/block.jpg';

/* ---------- the world IS the painting ----------
   An earlier pass drew the block out of canvas rectangles. It worked and it
   looked like canvas rectangles. The reference this is chasing settled the
   question: that world is one painted image with an invisible grid over it,
   and the engine only does depth = base + y. The art is the product.

   So: the painting is the world, fitted to the viewport, and everything below
   is expressed in the painting's own 1536x864 coordinates. No scrolling
   camera — the composition was painted to be seen whole, and panning around
   inside it would only ever show a worse crop of it. */
const IMG = { w: 1536, h: 864 };

// The plaza floor, traced off the painting. Kevin is kept inside this so he
// never walks up a wall or off into the void.
const FLOOR = [ [700,455], [1180,455], [1470,720], [1430,830], [430,830], [330,700], [470,520] ];

// Doors, in painting coordinates, taken from where they actually are.
// Doors in painting coordinates, read off the render rather than guessed.
// signY is where the name plate hangs above each shopfront.
const PLACES = [
  { x:300,  y:470, r:165, signY:300, name:"McKEVIN'S",     sub:'the shift',
    tip:"McKevin's. Where the shift is, and where $KEVIN comes from." },
  { x:776,  y:340, r:150, signY:150, name:'THE STOREROOM', sub:'4 written · 0 deployed',
    tip:'The storeroom. Four contracts written and tested. None deployed.' },
  { x:995,  y:380, r:150, signY:212, name:"KEVIN'S GYM",   sub:'no pain, only kevin',
    tip:"The gym. No pain, only Kevin.", href:'../gym/' },
  { x:1270, y:452, r:160, signY:300, name:'THE CARD ROOM', sub:'texas hold’em',
    tip:'The card room. He is not good at it.', href:'../poker/' },
];

const player = { x:880, y:660, vx:0, vy:0, dir:'front', flip:false, step:0, moving:false };

/* ---------- input ---------- */
const keys = new Set();
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
});
addEventListener('keyup', e => keys.delete(e.key.toLowerCase()));

const stick = document.getElementById('stick'), knob = document.getElementById('knob');
let stickV = {x:0,y:0}, stickId = null;
function stickAt(t){
  const r = stick.getBoundingClientRect();
  let dx = t.clientX-(r.left+r.width/2), dy = t.clientY-(r.top+r.height/2);
  const d = Math.hypot(dx,dy), max = r.width/2-12;
  if (d>max){ dx=dx/d*max; dy=dy/d*max; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  stickV = { x:dx/max, y:dy/max };
}
stick.addEventListener('pointerdown', e=>{ stickId=e.pointerId; stick.setPointerCapture(e.pointerId); stickAt(e); });
stick.addEventListener('pointermove', e=>{ if(e.pointerId===stickId) stickAt(e); });
const drop = e=>{ if(e.pointerId===stickId){ stickId=null; stickV={x:0,y:0}; knob.style.transform=''; } };
stick.addEventListener('pointerup', drop); stick.addEventListener('pointercancel', drop);

// tap the floor to walk there
let goal = null;
cv.addEventListener('pointerdown', e => {
  if (e.target !== cv) return;
  const p = toImg(e.clientX, e.clientY);
  if (inside(p.x, p.y)) goal = p;
});

/* ---------- fit ---------- */
let fit = { s:1, ox:0, oy:0 };
function resize(){
  const dpr = Math.min(devicePixelRatio||1, 2);
  cv.width = innerWidth*dpr; cv.height = innerHeight*dpr;
  cv.style.width = innerWidth+'px'; cv.style.height = innerHeight+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  // cover, so there is never a letterbox bar beside the painting
  const s = Math.max(innerWidth/IMG.w, innerHeight/IMG.h);
  fit = { s, ox:(innerWidth - IMG.w*s)/2, oy:(innerHeight - IMG.h*s)/2 };
}
addEventListener('resize', resize); resize();
const toScreen = (x,y) => ({ x: x*fit.s + fit.ox, y: y*fit.s + fit.oy });
const toImg = (x,y) => ({ x:(x-fit.ox)/fit.s, y:(y-fit.oy)/fit.s });

function inside(x,y){
  let hit = false;
  for (let i=0, j=FLOOR.length-1; i<FLOOR.length; j=i++){
    const [xi,yi]=FLOOR[i], [xj,yj]=FLOOR[j];
    if ((yi>y)!==(yj>y) && x < (xj-xi)*(y-yi)/(yj-yi)+xi) hit = !hit;
  }
  return hit;
}

/* ---------- draw ---------- */
function drawKevin(){
  const s = toScreen(player.x, player.y);
  // Y is squashed relative to X in an oblique view, so the character is scaled
  // by depth: further up the plaza reads as further away.
  const depth = 0.80 + 0.28*((player.y-455)/(830-455));
  const k = 0.86 * fit.s * depth;
  const w = ATLAS.cw*k, h = ATLAS.ch*k;
  ctx.save(); ctx.globalAlpha=.28;
  ctx.beginPath(); ctx.ellipse(s.x, s.y, w*0.30, h*0.06, 0,0,7);
  ctx.fillStyle='#000'; ctx.fill(); ctx.restore();
  if (!sheet.complete || !sheet.naturalWidth) return;
  const col = player.moving ? (player.step|0) % ATLAS.cols : 0;
  ctx.save(); ctx.translate(s.x, s.y-h);
  if (player.flip){ ctx.translate(w,0); ctx.scale(-1,1); }
  ctx.drawImage(sheet, col*ATLAS.cw, ATLAS.row[player.dir]*ATLAS.ch, ATLAS.cw, ATLAS.ch, 0,0,w,h);
  ctx.restore();
}

function drawSigns(){
  ctx.textAlign = 'center';
  for (const p of PLACES){
    const s = toScreen(p.x, p.signY);
    const active = near === p;
    const fs = Math.round(19*fit.s);
    ctx.font = `${fs}px 'Luckiest Guy', system-ui`;
    const w = ctx.measureText(p.name).width + 26*fit.s;
    const h = 30*fit.s;
    ctx.beginPath(); ctx.roundRect(s.x-w/2, s.y-h, w, h, 8*fit.s);
    ctx.fillStyle = active ? '#e8232b' : '#0b0b0b'; ctx.fill();
    ctx.lineWidth = 4*fit.s; ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
    ctx.fillStyle = '#ffe500';
    ctx.fillText(p.name, s.x, s.y - h/2 + fs*0.36);
    // a short post down to the roof, so the plate belongs to the building
    ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x, s.y + 14*fit.s);
    ctx.lineWidth = 5*fit.s; ctx.strokeStyle = '#0b0b0b'; ctx.stroke();
  }
}

/* ---------- loop ---------- */
const tip = document.getElementById('tip'), sub = document.getElementById('sub');
let near = null, last = performance.now();

function step(now){
  const dt = Math.min((now-last)/1000, .05); last = now;

  let ix = (keys.has('arrowright')||keys.has('d')?1:0) - (keys.has('arrowleft')||keys.has('a')?1:0);
  let iy = (keys.has('arrowdown')||keys.has('s')?1:0) - (keys.has('arrowup')||keys.has('w')?1:0);
  if (Math.abs(stickV.x)>.18 || Math.abs(stickV.y)>.18){ ix=stickV.x; iy=stickV.y; goal=null; }
  if (ix||iy) goal = null;
  if (goal){
    const dx = goal.x-player.x, dy = goal.y-player.y, d = Math.hypot(dx,dy);
    if (d < 12) goal = null; else { ix = dx/d; iy = dy/d; }
  }
  const m = Math.hypot(ix,iy); if (m>1){ ix/=m; iy/=m; }

  const SPEED = 300;
  player.vx += (ix*SPEED - player.vx)*Math.min(1, dt*12);
  player.vy += (iy*SPEED*0.62 - player.vy)*Math.min(1, dt*12);  // Y squashed ~1.6x
  const nx = player.x + player.vx*dt, ny = player.y + player.vy*dt;
  if (inside(nx, player.y)) player.x = nx; else player.vx = 0;
  if (inside(player.x, ny)) player.y = ny; else player.vy = 0;

  const sp = Math.hypot(player.vx, player.vy/0.62);
  player.moving = sp > 20;
  if (player.moving){
    player.step += dt*9*Math.min(1, sp/250);
    const ay = player.vy/0.62;
    if (Math.abs(player.vx) > Math.abs(ay)*1.3){ player.dir = player.vx>0?'right':'left'; player.flip=false; }
    else if (Math.abs(ay) > Math.abs(player.vx)*1.3){ player.dir = ay>0?'front':'back'; player.flip=false; }
    else { player.dir='diagonal'; player.flip = player.vx<0; }
  }

  let best=null, bd=Infinity;
  for (const p of PLACES){
    const d = Math.hypot(player.x-p.x, (player.y-p.y)/0.62);
    if (d < p.r && d < bd){ bd=d; best=p; }
  }
  if (best!==near){
    near=best; tip.classList.toggle('on', !!near);
    if (near) tip.textContent = near.tip + (near.href ? '  ·  press E to go in' : '');
    sub.textContent = near ? near.name.toLowerCase() : 'tap the ground or use the stick';
  }
  if (near && near.href && (keys.has('e')||keys.has('enter'))) location.href = near.href;

  ctx.fillStyle = '#ffe500'; ctx.fillRect(0,0,innerWidth,innerHeight);
  if (block.complete && block.naturalWidth)
    ctx.drawImage(block, fit.ox, fit.oy, IMG.w*fit.s, IMG.h*fit.s);
  drawSigns();
  drawKevin();
  requestAnimationFrame(step);
}

let ready = 0;
const go = () => { if (++ready === 2) { boot.remove(); requestAnimationFrame(step); } };
sheet.onload = go; block.onload = go;
sheet.onerror = block.onerror = () => { boot.textContent = 'could not load the block'; };
</script>
</body>
</html>
