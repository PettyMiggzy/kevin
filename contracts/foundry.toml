[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# WAS 0.8.24. Uniswap v4-core pins `=0.8.26` in PoolManager, and KevinFloorV4's
# tests deploy a real PoolManager rather than a mock — the only guarantee that
# contract makes is one the pool enforces, so the pool has to be the real one.
# Everything here is written against ^0.8.24 and does not use anything newer;
# the bump is to let v4-core into the build, and the 117 pre-existing tests are
# the check that it changed nothing.
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 1_000
via_ir = false
# WAS `paris`, chosen when nobody here had confirmed which fork Robinhood Chain
# (4663) was on. It is confirmed now, and by the strongest kind of evidence:
# Uniswap v4 is deployed on 4663, and v4's PoolManager cannot function without
# transient storage. TSTORE/TLOAD are Cancun. So the chain is at least Cancun,
# and KevinFloor — which talks to that PoolManager — needs the same.
evm_version = "cancun"
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./" }]

# Robinhood Chain. Kevin launches on 4663; nothing here reads that at runtime,
# it is only here so `forge script --rpc-url robinhood` knows where to point.
[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"

[profile.ci]
verbosity = 3
fuzz = { runs = 1_000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[invariant]
runs = 128
depth = 64
fail_on_revert = false
call_override = false

[lint]
# `block.timestamp` comparisons are load-bearing here on purpose: the emission
# period is measured in wall-clock seconds and a validator nudging it by a few
# seconds cannot change who is owed what, only when the last second lands.
exclude_lints = ["block-timestamp"]
