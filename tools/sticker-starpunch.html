<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kevin punches the star — sticker frames</title>
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Kevin punching the star, animated from the PACK'S OWN ARTWORK.
//
// The character here is the drawn one — assets/stickers/stills/star-power.png,
// produced by tools/gen-stickers-video.mjs off the hero-portrait reference —
// not the low-poly model the gym runs. Normally that still would go to Venice's
// video model to be animated; this animates it locally instead, which costs
// nothing and cannot drift off-model, because every frame IS the drawing.
const SIZE = 512;
const FRAMES = Number(new URL(location.href).searchParams.get('frames') || 48);
const SRC = '../assets/stickers/stills/star-power.png';

// Where the star sits is MEASURED, not typed in. It moves every time the still
// is regenerated, and a burst that fires next to the star instead of on it is
// worse than no burst.
const STAR_FALLBACK = { x: 692, y: 172 };

const canvas = document.getElementById('c');
canvas.width = canvas.height = SIZE;
const ctx = canvas.getContext('2d');

const img = new Image();
img.src = SRC;
await img.decode();

// --- cut the backdrop out ----------------------------------------------------
/**
 * Lift the character and the star off the flat backdrop, and find the star.
 *
 * A plain colour key cannot do this. On the current still the backdrop is
 * rgb(252,232,11) and parts of the star's fill are rgb(249,230,29) — three
 * levels apart in red, two in green. Any key loose enough to clear the backdrop
 * dissolves the star. What separates them is not colour, it is the star's heavy
 * black outline, so the cut is a flood fill inward from the frame edge: it
 * cannot get inside a closed shape.
 */
function cutout() {
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  const s = document.createElement('canvas');
  s.width = w;
  s.height = h;
  const sx = s.getContext('2d', { willReadFrequently: true });
  sx.drawImage(img, 0, 0);
  const d = sx.getImageData(0, 0, w, h);
  const p = d.data;
  const bg = [p[4 * (4 * w + 4)], p[4 * (4 * w + 4) + 1], p[4 * (4 * w + 4) + 2]];
  const nearBg = (k, t) =>
    Math.abs(p[k * 4] - bg[0]) <= t && Math.abs(p[k * 4 + 1] - bg[1]) <= t &&
    Math.abs(p[k * 4 + 2] - bg[2]) <= t;

  /** Grow a region from seeds over any pixel `ok` accepts. Shared by both fills. */
  const grow = (seeds, mark, ok) => {
    const st = [...seeds];
    for (const k of st) mark[k] = 1;
    let n = 0;
    const px = [];
    while (st.length) {
      const k = st.pop();
      n++;
      px.push(k);
      const x = k % w;
      const y = (k / w) | 0;
      const go = (nk) => { if (!mark[nk] && ok(nk)) { mark[nk] = 1; st.push(nk); } };
      if (x > 0) go(k - 1);
      if (x < w - 1) go(k + 1);
      if (y > 0) go(k - w);
      if (y < h - 1) go(k + w);
    }
    return { n, px };
  };

  const gone = new Uint8Array(w * h);
  const border = [];
  for (let x = 0; x < w; x++) { border.push(x, (h - 1) * w + x); }
  for (let y = 0; y < h; y++) { border.push(y * w, y * w + w - 1); }
  grow(border.filter((k) => nearBg(k, 26)), gone, (k) => nearBg(k, 26));

  // Backdrop trapped between his arm and his body is walled off from the frame
  // edge, so the fill above never reaches it. Those pockets are found as their
  // own islands and dropped BY SIZE, not by colour: a colour test tight enough
  // to spare the star does not exist here, and a previous version of this
  // punched holes right through the star's fill. A pocket between two limbs is
  // small; the star is a twentieth of the frame.
  // A pocket is bounded at BOTH ends. The ceiling keeps the star, which is a
  // twentieth of the frame. The floor matters just as much: parts of the star's
  // own fill sit within a whisker of the backdrop, so scattered single pixels
  // inside it pass the colour test, and each one is an island of one. Without a
  // floor they were all deleted and the star came out riddled with holes.
  const POCKET_MAX = w * h * 0.008;
  const POCKET_MIN = 150;
  const seenPocket = new Uint8Array(w * h);
  for (let k = 0; k < w * h; k++) {
    if (gone[k] || seenPocket[k] || !nearBg(k, 12)) continue;
    const { n, px } = grow([k], seenPocket, (nk) => !gone[nk] && nearBg(nk, 12));
    if (n >= POCKET_MIN && n <= POCKET_MAX) for (const j of px) gone[j] = 1;
  }

  // Two passes of erosion. Between the ink and the backdrop sits a ring of
  // half-and-half pixels, too dark to read as backdrop and too yellow to read
  // as ink; left in, they outline the whole character in yellow the moment it
  // sits on anything but yellow — which is every chat it will ever be in.
  for (let pass = 0; pass < 2; pass++) {
    const edge = [];
    for (let k = 0; k < w * h; k++) {
      if (gone[k]) continue;
      const x = k % w;
      const y = (k / w) | 0;
      if ((x > 0 && gone[k - 1]) || (x < w - 1 && gone[k + 1]) ||
          (y > 0 && gone[k - w]) || (y < h - 1 && gone[k + w])) edge.push(k);
    }
    for (const k of edge) gone[k] = 1;
  }
  for (let k = 0; k < w * h; k++) if (gone[k]) p[k * 4 + 3] = 0;
  sx.putImageData(d, 0, 0);

  // With the backdrop gone the drawing falls into islands: the character is far
  // and away the largest, the star is the next, and the rest are the little
  // white impact ticks. Taking the runner-up finds the star wherever it has
  // landed, which matters because it moves every time the still is regenerated
  // and a burst that fires beside the star is worse than no burst.
  const seen = new Uint8Array(w * h);
  let first = null;
  let second = null;
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let k = 0; k < w * h; k++) {
    if (seen[k] || gone[k]) continue;
    const { n, px } = grow([k], seen, (nk) => !gone[nk]);
    let sxSum = 0;
    let sySum = 0;
    for (const j of px) {
      const x = j % w;
      const y = (j / w) | 0;
      sxSum += x; sySum += y;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
    const c = { n, x: sxSum / n, y: sySum / n };
    if (!first || n > first.n) { second = first; first = c; }
    else if (!second || n > second.n) { second = c; }
  }
  const star = second && second.n > first.n * 0.02 ? { x: second.x, y: second.y } : STAR_FALLBACK;

  return { canvas: s, box: { x0, y0, x1, y1 }, star };
}

const { canvas: art, box, star: STAR } = cutout();

// Fit the art into the square. Anchored low rather than centred: the drawing
// runs off the bottom of its own frame, so there is no chin to leave room for,
// and the space is worth more above his fist where the star travels.
const bw = box.x1 - box.x0 + 1;
const bh = box.y1 - box.y0 + 1;
const scale = (SIZE * 0.84) / Math.max(bw, bh);
const drawW = art.width * scale;
const drawH = art.height * scale;
const originX = SIZE / 2 - (box.x0 + bw / 2) * scale;
const originY = SIZE * 0.985 - (box.y1 + 1) * scale;
const starX = originX + STAR.x * scale;
const starY = originY + STAR.y * scale;

// --- the loop ----------------------------------------------------------------
const clamp01 = (v) => Math.min(1, Math.max(0, v));
/** 0 -> 1 -> 0 across [a,b], flat zero outside it. */
const bump = (t, a, b) => (t < a || t > b ? 0 : Math.sin(clamp01((t - a) / (b - a)) * Math.PI));

/**
 * Wind up, drive, hit, settle. Every term is zero at both t=0 and t=1, so the
 * last frame hands back to the first with no seam — a sticker that jumps on
 * loop is the one thing people notice immediately.
 *
 * The drawing cannot be re-posed, so the punch is sold with weight instead:
 * he compresses before he throws it, stretches through it, and the recoil rings
 * out afterwards rather than stopping dead.
 */
function pose(t) {
  const dip = bump(t, 0, 0.24);
  const rise = bump(t, 0.24, 0.64);
  const hit = bump(t, 0.38, 0.54);
  // Recoil: a decaying wobble that has to reach exactly zero by t=1.
  const u = clamp01((t - 0.60) / 0.40);
  const ring = Math.sin(u * Math.PI * 3) * (1 - u) * (1 - u) * 7;

  const lift = dip * 9 - rise * 34 + ring;
  const sy = 1 - dip * 0.055 + rise * 0.045;
  const sx = 1 + dip * 0.050 - rise * 0.035;
  const tilt = (rise * 0.030 - dip * 0.012) * -1;

  ctx.clearRect(0, 0, SIZE, SIZE);
  ctx.save();
  // Scale about the feet, so a squash plants him rather than shrinking him
  // toward the middle of the frame.
  ctx.translate(SIZE / 2, SIZE * 0.975 + lift);
  ctx.rotate(tilt);
  ctx.scale(sx, sy);
  ctx.translate(-SIZE / 2, -(SIZE * 0.975));
  ctx.drawImage(art, originX, originY, drawW, drawH);
  ctx.restore();

  if (hit > 0.02) {
    // The burst travels with him, so it has to be placed through the same
    // transform the drawing just went through.
    const cx = SIZE / 2 + (starX - SIZE / 2) * sx;
    const cy = SIZE * 0.975 + lift + (starY - SIZE * 0.975) * sy;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.globalAlpha = Math.min(1, hit * 1.4);
    ctx.strokeStyle = '#FFFFFF';
    ctx.lineCap = 'round';
    ctx.lineWidth = 6;
    const r = 30 + hit * 26;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + 0.2;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(a) * (r + 16 + hit * 14), Math.sin(a) * (r + 16 + hit * 14));
      ctx.stroke();
    }
    ctx.restore();
  }
}

const frames = [];
for (let i = 0; i < FRAMES; i++) {
  pose(i / FRAMES);
  frames.push(canvas.toDataURL('image/png'));
}
window.__frames = frames;
window.__ready = true;
</script>
</body>
</html>
